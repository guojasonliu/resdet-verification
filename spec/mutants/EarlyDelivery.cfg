SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

CONSTANTS
    Replicas = {n1, n2, n3}
    RequestIds = {r1}
    Payloads = {p1}
    Responses = {v1}
    NoNode = NoNode
    NoValue = NoValue
    Quorum = 2
    MaxSlots = 1
    EnableBatching = FALSE
    PrioritizeUniqueDecisions = FALSE
    EnableTimeoutFallback = FALSE
    EnableNoLeaderFallback = FALSE
    EnableCrashes = FALSE
    MutantNoDedup = FALSE
    MutantNonContiguous = FALSE
    MutantAllDispatch = FALSE
    MutantNoQuorum = FALSE
    MutantEarlyDelivery = TRUE

INVARIANT AppliedPrefixCorrect
