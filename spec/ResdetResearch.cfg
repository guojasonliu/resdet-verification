\* Research-scale safety profile.
\*
\* This deliberately scales protocol width while leaving crash/recovery and
\* liveness to their focused configurations. Exhaustive exploration may be
\* expensive; scripts/check-research.sh also supports random simulation.

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

CONSTANTS
    Replicas = {n1, n2, n3, n4, n5}
    RequestIds = {r1, r2, r3, r4, r5, r6, r7, r8, r9, r10}
    Payloads = {p1}
    Responses = {v1, v2}
    NoNode = NoNode
    NoValue = NoValue
    Quorum = 3
    MaxSlots = 10
    EnableBatching = TRUE
    PrioritizeUniqueDecisions = TRUE
    EnableTimeoutFallback = FALSE
    EnableNoLeaderFallback = FALSE
    EnableCrashes = FALSE
    MutantNoDedup = FALSE
    MutantNonContiguous = FALSE
    MutantAllDispatch = FALSE
    MutantNoQuorum = FALSE
    MutantEarlyDelivery = FALSE

INVARIANTS
    TypeOK
    SelectionJustified
    StrictQuorumOnly
    NoDispatchBeforeSelection
    OnlyAuthorizedDispatch
    ObservedHasPhysicalExecution
    ProposalValidity
    ConsensusValidity
    AtMostOnePhysicalDispatch
    AtMostOnceDelivery
    ResponseAgreement
    PrefixAgreement
    ProcessedPrefixLearned
    LearnedOnlyDecided
    ProcessedWithinLog
    AppliedPrefixCorrect
    ResponseValidity
    SeenMatchesDelivered
    RaceWinnerAgreement
    NoEarlyDelivery
