SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

CONSTANTS
    Replicas = {n1, n2, n3}
    RequestIds = {r1}
    Payloads = {p1}
    Responses = {v1, v2}
    NoNode = NoNode
    NoValue = NoValue
    Quorum = 2
    MaxSlots = 1
    EnableBatching = FALSE
    PrioritizeUniqueDecisions = FALSE
    EnableTimeoutFallback = FALSE
    EnableNoLeaderFallback = FALSE
    EnableCrashes = TRUE
    MutantNoDedup = FALSE
    MutantNonContiguous = FALSE
    MutantAllDispatch = FALSE
    MutantNoQuorum = FALSE
    MutantEarlyDelivery = FALSE

INVARIANTS
    TypeOK
    SelectionJustified
    StrictQuorumOnly
    NoDispatchBeforeSelection
    OnlyAuthorizedDispatch
    ObservedHasPhysicalExecution
    ProposalValidity
    ConsensusValidity
    AtMostOnceDelivery
    ResponseAgreement
    PrefixAgreement
    ProcessedPrefixLearned
    LearnedOnlyDecided
    ProcessedWithinLog
    AppliedPrefixCorrect
    ResponseValidity
    SeenMatchesDelivered
    RaceWinnerAgreement
    NoEarlyDelivery
