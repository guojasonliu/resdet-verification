SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Replicas = {n1, n2, n3}
    RequestIds = {r1, r2}
    Payloads = {p1}
    Responses = {v1}
    NoNode = NoNode
    NoValue = NoValue
    Quorum = 2
    MaxSlots = 2
    EnableBatching = FALSE
    PrioritizeUniqueDecisions = TRUE
    EnableTimeoutFallback = FALSE
    EnableNoLeaderFallback = FALSE
    EnableCrashes = FALSE
    MutantNoDedup = FALSE
    MutantNonContiguous = FALSE
    MutantAllDispatch = FALSE
    MutantNoQuorum = FALSE
    MutantEarlyDelivery = FALSE

INVARIANTS
    TypeOK
    SelectionJustified
    ObservedHasPhysicalExecution
    ProposalValidity
    ConsensusValidity
    AtMostOnceDelivery
    ResponseAgreement
    PrefixAgreement
    ProcessedPrefixLearned
    LearnedOnlyDecided
    ProcessedWithinLog
    AppliedPrefixCorrect
    SeenMatchesDelivered
    RaceWinnerAgreement

PROPERTY Completion
